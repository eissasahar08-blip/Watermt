:root{

  --panel:#0f2229;

  --line-strong:rgba(120,196,204,0.32);
  --cyan:#2fc2d6;
  --cyan-soft:#7fdce8;
  --coral:#ff5a4e;
  --gold:#d9a441;

  --shadow:0 10px 30px rgba(0,0,0,0.45);

*{box-sizing:border-box;}

body{
margin:0;
min-height:100vh;
background:
  radial-gradient(1100px 600px at 15% -10%, rgba(47,194,214,0.10), transparent 55%),
  radial-gradient(900px 500px at 100% 10%, rgba(217,164,65,0.06), transparent 50%),
  linear-gradient(180deg,var(--bg-deep) 0%,var(--bg-deep2) 100%);
color:var(--text);
font-family:'Tajawal',Arial,sans-serif;
text-align:center;
padding-bottom:28px;
}

::selection{background:var(--cyan);color:#04211f;}

.title-box{
position:relative;
background:linear-gradient(180deg,var(--panel),var(--panel-2));
padding:20px 18px 18px;
margin:16px auto 12px;
width:92%;
max-width:760px;
border-radius:18px;
border:1px solid var(--line);
box-shadow:var(--shadow);
overflow:hidden;
}

.title-box::before{
content:"";
position:absolute;
inset:0 0 auto 0;
height:3px;
background:linear-gradient(90deg,transparent,var(--cyan),var(--gold),transparent);
background-size:200% 100%;
animation:flowline 6s linear infinite;
}

@keyframes flowline{
0%{background-position:200% 0;}
100%{background-position:-200% 0;}
}

.brand-row{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
margin-bottom:8px;
}

.brand-wrap{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:2px;
}

.brand-title-tilted{
  font-family:'Cairo',Arial,sans-serif;
  font-weight:800;
  font-size:16px;
  color:#fff;
  background:linear-gradient(90deg,rgba(47,194,214,0.18),rgba(217,164,65,0.18));
  border:1px solid var(--line-strong);
  padding:4px 14px;
  border-radius:8px;
  transform:rotate(-7deg);
  margin-bottom:-6px;
  white-space:nowrap;
  box-shadow:0 4px 10px rgba(0,0,0,0.35);
}

.brand-badge-img{
  width:130px;height:130px;
  object-fit:contain;
  flex:none;
  margin:4px 0;
}

h2{
margin:2px 0;
font-family:'Cairo',Arial,sans-serif;
font-weight:800;
font-size:22px;
letter-spacing:0.2px;
color:#fff;
}

.main-title{
margin:6px 0 0;
font-family:'Cairo',Arial,sans-serif;
font-weight:900;
font-size:24px;
letter-spacing:0.3px;
color:#fff;
}

.subtitle{
display:flex;
align-items:center;
justify-content:center;
gap:6px;
margin:6px 0 12px;
font-size:12px;
color:var(--cyan-soft);
letter-spacing:0.5px;
}

.live-dot{
width:8px;height:8px;border-radius:50%;
background:var(--coral);
box-shadow:0 0 0 0 rgba(255,90,78,0.6);
animation:pulse 1.8s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(255,90,78,0.55);}
70%{box-shadow:0 0 0 9px rgba(255,90,78,0);}
100%{box-shadow:0 0 0 0 rgba(255,90,78,0);}
}

.credits{
font-size:12px;
line-height:1.8;
color:var(--muted);
border-top:1px dashed var(--line);
padding-top:14px;
margin-top:4px;
text-align:center;
}

.credit-card{
display:inline-flex;
flex-direction:column;
align-items:center;
gap:4px;
padding:11px 22px;
background:#0b1c20;
border:1px solid rgba(47,194,214,0.4);
border-radius:12px;
}

.credit-card:hover{border-color:var(--cyan);}

.credit-label{
font-family:'Tajawal',Arial,sans-serif;
font-weight:500;
font-size:12px;
color:var(--muted);
white-space:nowrap;
}

.bold{
font-size:12.5px;
font-weight:700;
color:#fff;
font-family:'Cairo',Arial,sans-serif;
white-space:nowrap;
}

#commentInput{
width:100%;
min-height:76px;
background:#081416;
color:var(--text);
border:1px solid var(--line);
border-radius:12px;
padding:12px;
font-family:'Tajawal',Arial,sans-serif;
font-size:14px;
resize:vertical;
}
#commentInput:focus{outline:2px solid var(--cyan);outline-offset:1px;}

.send-btn{
margin-top:10px;
padding:10px 22px;
background:linear-gradient(135deg,var(--cyan),#1e8fa0);
color:#04211f;
border:none;
border-radius:10px;
font-weight:800;
font-family:'Cairo',Arial,sans-serif;
cursor:pointer;
box-shadow:0 6px 16px rgba(47,194,214,0.25);
transition:transform .15s ease,box-shadow .15s ease;
}
.send-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(47,194,214,0.35);}
.send-btn:active{transform:translateY(0);}

#commentsList{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:96px;overflow-y:auto;}

.comment-bubble{
background:#0b1c20;
border:1px solid var(--line);
border-radius:12px;
padding:10px 12px;
text-align:right;
color:var(--text);
}
.comment-time{font-size:11px;color:var(--muted);display:block;margin-top:6px;}
.comment-del{
margin-top:8px;
background:rgba(255,90,78,0.12);
color:var(--coral);
border:1px solid rgba(255,90,78,0.35);
padding:5px 10px;
border-radius:8px;
cursor:pointer;
font-family:'Tajawal',Arial,sans-serif;
font-size:12.5px;
}

.updates-bar{
  position:relative;
  width:92%;
  max-width:760px;
  margin:0 auto 14px;
  background:linear-gradient(180deg,rgba(255,90,78,0.14),rgba(15,34,41,0.9));
  border:1px solid rgba(255,90,78,0.45);
  border-radius:16px;
  box-shadow:0 8px 24px rgba(255,90,78,0.12);
  overflow:hidden;
  text-align:right;
}

.updates-bar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:12px 14px;
  border-bottom:1px solid rgba(255,90,78,0.25);
}

.updates-bar-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'Cairo',Arial,sans-serif;
  font-weight:800;
  font-size:15px;
  color:#fff;
}

.updates-ticker{
  overflow:hidden;
  white-space:nowrap;
  border-top:1px solid rgba(255,90,78,0.2);
  border-bottom:1px solid rgba(255,90,78,0.2);
  background:rgba(255,90,78,0.06);
  position:relative;
  height:37px;
}

.updates-ticker-track{
  position:absolute;
  top:0;
  left:0;
  right:auto;
  white-space:nowrap;
  font-size:13.5px;
  line-height:37px;
  color:var(--text);
  will-change:transform;
}

.updates-ticker-track .sep{color:#ff5a4e;margin:0 14px;}

.updates-bar-body{
  padding:10px 14px 12px;
}

.update-item{
  display:flex;
  align-items:flex-start;
  gap:8px;
  background:rgba(255,90,78,0.08);
  border:1px solid rgba(255,90,78,0.22);
  border-radius:10px;
  padding:9px 10px;
  margin-bottom:8px;
  font-size:13.5px;
  line-height:1.6;
  color:var(--text);
}

.update-item .update-icon{flex:none;font-size:15px;line-height:1.5;}
.update-item .update-text{flex:1;}
.update-item .update-date{font-size:11px;color:var(--muted);margin-top:3px;}
.update-item .update-del{
  flex:none;background:none;border:none;color:#ff5a4e;
  font-size:14px;cursor:pointer;padding:0 2px;
}

.updates-empty{color:var(--muted);font-size:12.5px;padding:6px 0;text-align:center;}

.updates-add-box{
  display:flex;
  gap:8px;
  align-items:center;
}

.updates-add-box input{
  flex:1;
  background:#081416;
  color:var(--text);
  border:1px solid rgba(255,90,78,0.3);
  border-radius:10px;
  padding:10px;
  font-family:'Tajawal',Arial,sans-serif;
  font-size:13.5px;
}

.updates-add-box button{
  flex:none;
  padding:10px 16px;
  background:linear-gradient(135deg,#ff5a4e,#c73a30);
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:800;
  font-family:'Cairo',Arial,sans-serif;
  cursor:pointer;
}

.panel-card{
width:92%;
max-width:760px;
margin:14px auto;
background:linear-gradient(180deg,var(--panel),var(--panel-2));
padding:16px;
border-radius:18px;
border:1px solid var(--line);
box-shadow:var(--shadow);
text-align:right;
}

.panel-title{
display:flex;
align-items:center;
gap:8px;
font-family:'Cairo',Arial,sans-serif;
font-weight:800;
font-size:16px;
color:#fff;
margin:0 0 12px;
}

.panel-title .bar{
width:4px;height:16px;border-radius:3px;
background:linear-gradient(180deg,var(--cyan),var(--gold));
flex:none;
}

.map-card{
width:92%;
max-width:760px;
margin:14px auto;
background:linear-gradient(180deg,var(--panel),var(--panel-2));
border-radius:18px;
border:1px solid var(--line);
box-shadow:var(--shadow);
padding:12px;
}

.map-scroll{
overflow:auto;
border-radius:12px;
-webkit-overflow-scrolling:touch;
}

.map{
position:relative;
width:100%;
margin:0 auto;
border-radius:12px;
border:1px solid var(--line-strong);
overflow:hidden;
background:#04100f;
transition:width .2s ease;
}

.zoom-controls{
display:flex;
gap:6px;
flex:none;
}
.zoom-controls button{
width:28px;
height:28px;
border-radius:8px;
background:#0b1c20;
color:var(--cyan-soft);
border:1px solid rgba(120,196,204,0.3);
font-size:15px;
line-height:1;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}
.zoom-controls button:active{background:#0f272d;}

.map img{
width:100%;
display:block;
pointer-events:none;
}

svg{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

.station{
position:absolute;
width:11px;
height:11px;
background:var(--coral);
box-shadow:0 0 8px rgba(255,90,78,0.7);
border-radius:3px;
transform:translate(-50%,-50%);
animation:blink 1.5s infinite;
cursor:pointer;
}
.area{
position:absolute;
width:8px;
height:8px;
border-radius:50%;
background:var(--cyan);
box-shadow:0 0 4px rgba(47,194,214,0.6);
transform:translate(-50%,-50%);
animation:blinkBlue 2s infinite;
cursor:pointer;
}

.popup{
position:fixed;
top:16px;
left:16px;
right:16px;
margin:0 auto;
max-width:380px;
background:linear-gradient(180deg,#0f2229,#0a171b);
border:1px solid var(--line-strong);
padding:18px 16px 16px;
border-radius:16px;
display:none;
z-index:999999;
min-width:240px;
line-height:1.7;
box-shadow:0 20px 50px rgba(0,0,0,0.6);
max-height:82vh;
overflow-y:auto;
}

.popup-close{
position:absolute;
top:10px;
left:10px;
background:rgba(255,90,78,0.15);
color:var(--coral);
border:1px solid rgba(255,90,78,0.4);
border-radius:8px;
width:30px;height:30px;
cursor:pointer;
font-size:15px;
line-height:1;
}

.station-line{
stroke:var(--coral);
stroke-width:0.7;
opacity:0.16;
stroke-dasharray:2 10;
animation:redFlow 80s linear infinite;
stroke-linecap:round;
fill:none;
}
.water-line{
display:none;
}

@keyframes flow{
from{stroke-dashoffset:0;}
to{stroke-dashoffset:-200;}
}
@keyframes redFlow{
from{stroke-dashoffset:0;}
to{stroke-dashoffset:-800;}
}
.area-inactive{
background:#5a6b6e !important;
box-shadow:none !important;
animation:none !important;
opacity:0.32;
width:6px !important;
height:6px !important;
}

@keyframes blink{
0%{opacity:0.35;}
50%{opacity:1;}
100%{opacity:0.35;}
}

@keyframes blinkBlue{
0%{opacity:0.5;}
50%{opacity:0.9;}
100%{opacity:0.5;}
}

.legend{
width:92%;
max-width:760px;
margin:14px auto;
background:linear-gradient(180deg,var(--panel),var(--panel-2));
padding:14px 16px;
border-radius:18px;
border:1px solid var(--line);
box-shadow:var(--shadow);
font-size:14px;
text-align:right;
}

.legend-row{
display:flex;

gap:10px;

.legend-chip{

.box-red{width:11px;height:11px;background:var(--coral);display:inline-block;border-radius:3px;box-shadow:0 0 6px rgba(255,90,78,0.6);}

.add-img{
width:110px;
border-radius:10px;
border:1px solid var(--line-strong);
display:block;
margin:0 0 0 auto;
}

.admin-btn{
display:inline-flex;
align-items:center;
gap:8px;
margin:16px auto 6px;
padding:11px 22px;
background:#0b1c20;
color:var(--gold);
border:1px solid rgba(217,164,65,0.4);
border-radius:12px;
font-family:'Cairo',Arial,sans-serif;
font-weight:700;
font-size:14px;
cursor:pointer;
}
.admin-btn:hover{border-color:var(--gold);}

.sheet-btn{
display:inline-flex;
align-items:center;
gap:8px;
padding:11px 22px;
background:#0b1c20;
color:var(--cyan-soft);
border:1px solid rgba(47,194,214,0.4);
border-radius:12px;
font-family:'Cairo',Arial,sans-serif;
font-weight:700;
font-size:14px;
cursor:pointer;
text-decoration:none;
}
.sheet-btn:hover{border-color:var(--cyan);}

#viewsBox, #installsBox{
margin:10px auto 4px;
background:#0b1c20;
color:var(--muted);
padding:10px 16px;
width:fit-content;
min-width:180px;
border-radius:999px;
border:1px solid var(--line);
font-size:13px;
letter-spacing:0.3px;
}

@media (max-width:480px){
  h2{font-size:19px;}
  .panel-card,.map-card,.legend,.title-box{width:94%;border-radius:16px;}
}

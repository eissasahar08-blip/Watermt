.main-title{

.subtitle{

.map-card{

.zoom-controls{

border:1px solid rgba(120,196,204,0.3);

display:flex;
align-items:center;
justify-content:center;
}
.zoom-controls button:active{background:#0f272d;}

.map img{

svg{

.water-line{

@keyframes flow{
from{stroke-dashoffset:0;}
to{stroke-dashoffset:-200;}

@keyframes redFlow{
from{stroke-dashoffset:0;}
to{stroke-dashoffset:-800;}
}
@keyframes blink{
0%{opacity:0.35;}

100%{opacity:0.35;}

  mapZoom = Math.min(ZOOM_MAX, +(mapZoom + ZOOM_STEP).toFixed(2));

  mapZoom = Math.max(ZOOM_MIN, +(mapZoom - ZOOM_STEP).toFixed(2));

}

function compressImage(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxWidth){
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    `<div style="color:#8fb0b4;font-size:12.5px;padding:8px 0;">جاري ضغط ورفع الصور...</div>`;

  const compressPromises = Array.from(files).map(file => compressImage(file, 900, 0.55));

  Promise.all(compressPromises)
    .then(newDataUrls => {
      const docRef = db.collection("stationPhotos").doc(stationId);
      return docRef.get().then(doc => {
        const existing = (doc.exists && doc.data().urls) ? doc.data().urls : [];
        const merged = existing.concat(newDataUrls);

        // حماية بسيطة: حجم مستند Firestore محدود بـ 1MB، فما منسمح يتخطى ذلك
        const totalSize = JSON.stringify(merged).length;
        if(totalSize > 900000){
          throw new Error("SIZE_LIMIT");
        }

        return docRef.set({ urls: merged });
      });
    })
    .then(() => loadStationPhotos(stationId))
    .catch(err => {
      console.log(err);
      const msg = (err && err.message === "SIZE_LIMIT")
        ? "وصلتوا للحد الأقصى لعدد/حجم الصور لهاي المحطة. احذفي صورة قديمة قبل ما تضيفي جديدة."
        : "صار خطأ برفع الصور. جرب كمان مرة.";
      document.getElementById("stationGallery").innerHTML =
        `<div style="color:#ff5a4e;font-size:12.5px;">${msg}</div>`;
    });
}

function deleteStationPhoto(stationId, url){
  if(!confirm("حذف هاي الصورة؟")) return;

  const docRef = db.collection("stationPhotos").doc(stationId);
  docRef.get().then(doc => {
    const existing = (doc.exists && doc.data().urls) ? doc.data().urls : [];
    const updated = existing.filter(u => u !== url);
    docRef.set({ urls: updated }).then(() => loadStationPhotos(stationId));
  });
}

// ===== إظهار زر الإدمن فقط بضغط سري (5 ضغطات متتالية على الشعار خلال ثانيتين) =====
(function(){
  let taps = 0;
  let timer = null;
  const logo = document.getElementById("secretLogo");
  if(logo){
    logo.addEventListener("click", function(){
      taps++;
      if(timer) clearTimeout(timer);
      timer = setTimeout(() => { taps = 0; }, 2000);
      if(taps >= 5){
        document.getElementById("adminBtn").style.display = "inline-flex";
        taps = 0;
      }
    });
  }
})();
